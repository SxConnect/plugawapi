name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: plugawapi-base

jobs:
  server:
    name: server
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: plugawapi-base/go.mod
          cache: true
      - run: go mod download
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
